# Deterministic CI for the Augur design system (issue #6).
#
# Job names below are stable check names: they are the recommended
# required status checks for branch protection (recorded with exact
# recommendations in the PR that established this workflow).
#
# Every job installs from the committed bun.lock with
# `--frozen-lockfile`, so CI cannot pass while package.json and the
# lockfile disagree.
#
# Deliberately absent from this workflow — do not add silent placeholders:
# - Package build: no build command exists yet; bundled package output is
#   deferred until actual requirements exist (issue #1 decision).
# - AI design review: advisory only, never a blocking gate
#   (ARCHITECTURE.md, Validation and Review).
#
# `registry` (issue #4) keeps the committed registry artifacts consumable
# at every commit a release tag could point to: generated-output drift,
# shadcn schema validation, and the independent-consumer install smoke.
#
# `package` (issue #9) packs the package tarball, installs it into a plain-HTML
# consumer, and checks the theme and a component stylesheet in Chromium with
# no React, Tailwind or font import.
#
# `docs-verification` (issue #15) covers the docs app: clean Markdown,
# real-browser behavior (fonts, theme contract, keyboard, mobile, the
# full starter-component set including Dialog focus/dismissal/scroll
# behavior in both themes and at 375px), and controlled content-failure
# paths. Not covered there and still manual: cross-browser runs beyond
# Chromium, visual-regression baselines, and interaction review beyond
# the scripted assertions.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The release workflow runs every gate below on the exact commit it tags.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with `packageManager` in package.json.
  BUN_VERSION: "1.4.0"

jobs:
  design-lint:
    name: design-lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: designmd lint (DESIGN.md validity)
        run: bun run lint

  code-lint:
    name: code-lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: "Code lint (oxlint: typescript, react-hooks, jsx-a11y)"
        run: bun run lint:code

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: tsc --noEmit (sources, scripts, tests)
        run: bun run typecheck

  tokens:
    name: tokens
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: Token drift check (tokens:check)
        run: bun run --cwd packages/design-system tokens:check
      - name: Controlled token failure paths (tokens:verify-failures)
        run: bun run --cwd packages/design-system tokens:verify-failures

  workspace-smoke:
    name: workspace-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: Workspace boundary smoke check (check:workspace)
        run: bun run check:workspace

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: Unit and accessibility tests (Vitest, Testing Library, axe)
        run: bun run test

  registry:
    name: registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: Registry drift check (registry:check)
        run: bun run --cwd packages/design-system registry:check
      - name: shadcn schema validation (registry:validate)
        run: bun run --cwd packages/design-system registry:validate
      - name: Independent-consumer install smoke (consumer-smoke)
        run: bun scripts/consumer-smoke.ts

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Package tarball smoke (package-smoke)
        run: bun scripts/package-smoke.ts

  docs-verification:
    name: docs-verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Frozen install
        run: bun install --frozen-lockfile
      # Pin the Chromium build: playwright is pinned to 1.61.1 in
      # package.json, whose registry resolves to this fixed browser build.
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Build docs (base /)
        run: bun run --cwd apps/docs build
      - name: Clean-Markdown and llms.txt verification (verify-markdown)
        run: bun apps/docs/fixtures/verify-markdown.mjs
      - name: Browser verification (Playwright)
        # The 2-core runner defaults to 1 worker; forcing 2 did not help
        # (contention on the same cores), so the default is kept.
        run: bun run test:browser
      # Runs last on purpose: it stages invalid content, so it must not
      # affect the checks above. It clears both Astro content
      # caches before and after each scenario and removes dist at the
      # end (see the script header), so the outcome cannot depend on the
      # preceding steps' cache state.
      - name: Controlled content-failure verification (verify-content-failures)
        run: bun apps/docs/fixtures/verify-content-failures.mjs
