# Cuts one immutable design-system release (issue #4, RELEASING.md).
#
# Run it by hand from `main` after the release-preparation PR has merged:
# Actions → Release → Run workflow, version `X.Y.Z`. It re-runs every CI gate
# on the dispatched commit, verifies the release metadata, packs the package
# tarball and smoke-tests it, then creates the annotated tag `vX.Y.Z` on that
# commit and the matching GitHub Release with the tarball attached.
#
# It never moves, deletes or force-pushes a tag. If `vX.Y.Z` exists the run
# fails; a bad release is superseded by the next patch release.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, X.Y.Z (no leading v)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Keep in sync with `packageManager` in package.json.
  BUN_VERSION: "1.4.0"

jobs:
  ci:
    name: CI gates
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  release:
    name: Tag and publish v${{ inputs.version }}
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the dispatched commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: Verify release metadata (check:release)
        env:
          VERSION: ${{ inputs.version }}
        run: bun run check:release "$VERSION" --notes "$RUNNER_TEMP/release-notes.md"
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Pack and smoke-test the package tarball
        run: bun scripts/package-smoke.ts --out "$RUNNER_TEMP/pack"
      - name: Create the annotated tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Augur Design System v$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/v$VERSION"
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION" --verify-tag --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "$RUNNER_TEMP/pack/augurproject-design-system-$VERSION.tgz"
